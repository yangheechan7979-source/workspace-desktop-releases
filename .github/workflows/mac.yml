name: Build Mac
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node build-mac.cjs
      - run: node check-mac.cjs out/Workspace-darwin-universal/Workspace.app/Contents/MacOS/Workspace
      - uses: actions/upload-artifact@v4
        with:
          name: mac-release
          path: dist/Workspace-Mac.*
  intel:
    needs: build
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: mac-release
          path: dist
      - run: ditto -x -k dist/Workspace-Mac.zip unpacked
      - run: node check-mac.cjs unpacked/Workspace.app/Contents/MacOS/Workspace
  publish:
    needs: [build, intel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-release
          path: dist
      - run: gh release upload v1.0.1 dist/Workspace-Mac.dmg dist/Workspace-Mac.zip --repo "$GITHUB_REPOSITORY" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
